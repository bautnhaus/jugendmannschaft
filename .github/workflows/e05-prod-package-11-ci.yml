name: E05 PROD Paket 11 isolated PostgreSQL CI
on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/20261115100000_e05_prod_paket_11_suspension_aware_recommendation_nomination.sql'
      - 'supabase/rollback/20261115100000_e05_prod_paket_11_suspension_aware_recommendation_nomination_rollback.sql'
      - 'docs/prod-release/test-package-11/**'
      - '.github/workflows/e05-prod-package-11-ci.yml'
  workflow_dispatch:
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_11_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_11_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_11_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Paket-6 PROD baseline
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-11/bootstrap.sql
      - name: Apply exact Paket-11 PROD migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115100000_e05_prod_paket_11_suspension_aware_recommendation_nomination.sql
      - name: Assert ACLs, trigger preservation, and suspension behavior
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-11/assertions.sql
      - name: Apply guarded Paket-11 rollback
        run: psql -v ON_ERROR_STOP=1 -f supabase/rollback/20261115100000_e05_prod_paket_11_suspension_aware_recommendation_nomination_rollback.sql
      - name: Assert pre-Paket-11 PROD state restored
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-11/rollback_assertions.sql
