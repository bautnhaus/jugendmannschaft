name: E05 PROD Paket 9 isolated PostgreSQL CI
on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/20261114235000_e05_prod_paket_09_manual_suspension_card_correction.sql'
      - 'docs/prod-release/test-package-09/**'
      - '.github/workflows/e05-prod-package-09-ci.yml'
  workflow_dispatch:
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_09_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_09_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_09_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare minimal PROD Paket-1-bis-7 baseline
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-08/bootstrap.sql
      - name: Apply exact Paket-8 baseline
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114230000_e05_prod_paket_08_early_suspension_reset.sql
      - name: Prepare remaining Paket-1-bis-8 baseline objects
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-09/bootstrap.sql
      - name: Apply exact Paket-9 migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114235000_e05_prod_paket_09_manual_suspension_card_correction.sql
      - name: Verify structure, ACL, audit protections and package boundaries
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-09/assertions.sql
