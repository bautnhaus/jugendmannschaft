name: E05 PROD Paket 10 isolated PostgreSQL CI
on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/20261115090000_e05_prod_paket_10_training_date_suspension_chronology.sql'
      - 'supabase/rollback/20261115090000_e05_prod_paket_10_training_date_suspension_chronology_rollback.sql'
      - 'docs/prod-release/test-package-10/**'
      - '.github/workflows/e05-prod-package-10-ci.yml'
  workflow_dispatch:
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_10_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_10_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated base schema and Paket-9 dependencies
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-10/bootstrap.sql
      - name: Apply exact Paket-8 PROD migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114230000_e05_prod_paket_08_early_suspension_reset.sql
      - name: Apply exact Paket-9 PROD migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114235000_e05_prod_paket_09_manual_suspension_card_correction.sql
      - name: Snapshot Paket-9 trigger and policy baseline
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-10/snapshot-baseline.sql
      - name: Apply exact Paket-10 PROD migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115090000_e05_prod_paket_10_training_date_suspension_chronology.sql
      - name: Assert chronology, all-matchday eligibility, ACL, RLS, triggers and data preservation
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-10/assertions.sql
      - name: Apply guarded function-only rollback
        run: psql -v ON_ERROR_STOP=1 -f supabase/rollback/20261115090000_e05_prod_paket_10_training_date_suspension_chronology_rollback.sql
      - name: Assert rollback restored exact Paket-9 behavior
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-10/rollback_assertions.sql
