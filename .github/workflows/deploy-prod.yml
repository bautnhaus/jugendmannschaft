name: Deploy PROD

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure PROD Supabase
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text()

          dev_url = "https://pzazqvvoruqnqhcorbwx.supabase.co"
          dev_key = "sb_publishable_hNQoCezONeov2Zfv_Sg7GA_ns2poaJq"

          prod_url = "https://qdugtpzgefpswnnqbusd.supabase.co"
          prod_key = "sb_publishable_O2lK6QCTWa4YlVdkljMcDw_zrSMfa3W"

          if dev_url not in text:
              raise SystemExit("DEV Supabase URL wurde in index.html nicht gefunden.")

          if dev_key not in text:
              raise SystemExit("DEV Supabase Publishable Key wurde in index.html nicht gefunden.")

          text = text.replace(dev_url, prod_url)
          text = text.replace(dev_key, prod_key)

          path.write_text(text)
          PY

      - name: Push tested develop state to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B main
          git push origin main --force

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
